services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pinpoint
      POSTGRES_PASSWORD: pinpoint_dev_only
      POSTGRES_DB: pinpoint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinpoint -d pinpoint"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
