[project]
name = "pinpoint-backend"
version = "0.1.0"
description = "PINPOINT Geographical Identity System: API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "pyjwt>=2.8",
  "cryptography>=42",
  "segno>=1.6",
  "python-barcode>=0.15",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["db: needs the PostGIS test database (docker compose up -d db)"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]
# E501: the formatter wraps what it can; long string literals and call lines are left to review.
# N818: domain errors read better without an "Error" suffix (NotFound, Conflict, ...).
ignore = ["E501", "N818"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Cookie", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501", "S608"]
# Alembic generates these files (long lines, import order, quoting); hand-written SQL is intentional.
"migrations/**" = ["E501", "I001", "UP", "S608", "N", "F401"]
